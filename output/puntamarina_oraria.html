<title>Punta Marina — Tabella meteo oraria (dati reali)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#182230; --ink-soft:#4b5768; --ink-faint:#8592a3;
  --surface:#eef1f6; --panel:#ffffff; --panel-alt:#f6f8fb; --panel-line:#dde3ec;
  --accent:#2f6690; --accent-soft:#e4edf4;
  --sev0-bg:#ffffff; --sev0-line:#c9d2de; --sev0-fg:#37404d;
  --sev1-bg:#ffd23f; --sev1-fg:#3a2c02;
  --sev2-bg:#ff9142; --sev2-fg:#3a1e02;
  --sev3-bg:#e14b3f; --sev3-fg:#fff7f5;
  --sev4-bg:#c02893; --sev4-fg:#fff5fb;
  --consensus-bg:var(--panel-alt);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef2f7; --ink-soft:#a7b2c2; --ink-faint:#6d7889;
    --surface:#141a22; --panel:#1b232e; --panel-alt:#20293d; --panel-line:#2b3543;
    --accent:#7fb2d9; --accent-soft:#20303c;
    --sev0-bg:#232d3a; --sev0-line:#3a4656; --sev0-fg:#c7d0dc;
    --sev1-bg:#caa233; --sev1-fg:#241a00;
    --sev2-bg:#cf7936; --sev2-fg:#2a1300;
    --sev3-bg:#b6473c; --sev3-fg:#fff2ef;
    --sev4-bg:#9c2d80; --sev4-fg:#fdeef8;
    --consensus-bg:var(--panel-alt);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef2f7; --ink-soft:#a7b2c2; --ink-faint:#6d7889;
  --surface:#141a22; --panel:#1b232e; --panel-alt:#20293d; --panel-line:#2b3543;
  --accent:#7fb2d9; --accent-soft:#20303c;
  --sev0-bg:#232d3a; --sev0-line:#3a4656; --sev0-fg:#c7d0dc;
  --sev1-bg:#caa233; --sev1-fg:#241a00;
  --sev2-bg:#cf7936; --sev2-fg:#2a1300;
  --sev3-bg:#b6473c; --sev3-fg:#fff2ef;
  --sev4-bg:#9c2d80; --sev4-fg:#fdeef8;
  --consensus-bg:var(--panel-alt);
  color-scheme: dark;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--surface); color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
.page{ max-width:1180px; margin:0 auto; padding:40px 24px 64px; display:flex; flex-direction:column; gap:24px; }

.masthead{ display:flex; flex-direction:column; gap:6px; }
.eyebrow-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.eyebrow{ font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); }
.version-badge{ font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:700; letter-spacing:0.04em; color:var(--ink-soft); background:var(--panel-alt); border:1px solid var(--panel-line); padding:3px 9px; border-radius:999px; white-space:nowrap; }
h1{ font-family:"Archivo", sans-serif; font-weight:900; font-size:clamp(26px,4vw,38px); line-height:1.05; letter-spacing:-0.01em; margin:2px 0 0; text-wrap:balance; }
h1 em{ font-style:normal; font-weight:700; color:var(--ink-soft); }
.sub{ margin:2px 0 0; font-size:14.5px; color:var(--ink-soft); max-width:76ch; line-height:1.5; }
.meta-strip{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint); }
.spectrum{ margin-top:14px; height:5px; border-radius:3px;
  background:linear-gradient(90deg, var(--sev0-line) 0 18%, var(--sev1-bg) 18% 38%, var(--sev2-bg) 38% 58%, var(--sev3-bg) 58% 78%, var(--sev4-bg) 78% 100%); }

.almanac-panel{ background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:14px 18px 6px; }
.almanac-panel .legend-title{ display:block; margin-bottom:6px; }
.time-cell{ flex-direction:column; align-items:flex-start; justify-content:center; gap:0; font-weight:600; font-size:13px; }
.moon-cell{ flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; }
.moon-cell .moonpct{ font-weight:700; font-size:13px; }
.moon-cell .moonlabel{ font-family:"IBM Plex Sans", sans-serif; font-size:9.5px; font-weight:500; color:var(--ink-faint); }
.moon-cell .spread-track{ background:var(--panel-line); }
.moon-cell .spread-fill{ background:var(--ink-soft); opacity:.5; }

.toolbar{ display:flex; align-items:center; flex-wrap:wrap; gap:14px 18px; padding:14px 18px; background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; }
.legend-title{ font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); }
.swatches{ display:flex; flex-wrap:wrap; gap:8px; }
.sw{ display:flex; align-items:baseline; gap:6px; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--panel-line); }
.sw em{ font-style:normal; font-weight:500; opacity:0.85; }
.sw-0{ background:var(--sev0-bg); color:var(--sev0-fg); border-color:var(--sev0-line); }
.sw-1{ background:var(--sev1-bg); color:var(--sev1-fg); }
.sw-2{ background:var(--sev2-bg); color:var(--sev2-fg); }
.sw-3{ background:var(--sev3-bg); color:var(--sev3-fg); }
.sw-4{ background:var(--sev4-bg); color:var(--sev4-fg); }
.models-key{ display:flex; flex-wrap:wrap; gap:6px 10px; margin-left:auto; }
.mk{ font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:600; color:var(--ink-soft); padding:3px 8px; border:1px solid var(--panel-line); border-radius:6px; background:var(--panel-alt); }
.mk b{ color:var(--ink); }

.sections{ display:flex; flex-direction:column; gap:14px; }
details.param{ background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; overflow:hidden; }
details.param[open] summary{ border-bottom:1px solid var(--panel-line); }
summary{ list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:baseline; gap:10px; font-family:"Archivo", sans-serif; font-weight:800; font-size:16px; flex-wrap:wrap; }
summary::-webkit-details-marker{ display:none; }
summary .arrow{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12px; color:var(--accent); transition:transform .15s ease; }
details[open] summary .arrow{ transform:rotate(90deg); }
summary .unit{ font-family:"IBM Plex Mono", monospace; font-weight:500; font-size:12px; color:var(--ink-faint); }
summary .desc{ font-family:"IBM Plex Sans",sans-serif; font-weight:500; font-size:12.5px; color:var(--ink-faint); margin-left:auto; }
summary .warn{ font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:11px; color:var(--sev2-fg); background:var(--sev1-bg); padding:2px 7px; border-radius:5px; }

.table-wrap{ overflow-x:auto; padding:6px 10px 14px; }
.pgrid{ display:grid; grid-template-columns:150px repeat(7,1fr); }
.pgrid.hourly{ grid-template-columns:150px repeat(var(--ncols),40px); min-width:calc(150px + var(--ncols)*40px); }

.cell{ display:flex; align-items:center; padding:4px 10px; font-family:"IBM Plex Mono", monospace; border-bottom:1px solid var(--panel-line); }
.hourly .cell{ padding:3px 3px; font-size:10.5px; justify-content:center; }
.rowlabel{ font-family:"IBM Plex Sans", sans-serif; font-size:12.5px; color:var(--ink-soft); position:sticky; left:0; background:var(--panel); z-index:2; justify-content:flex-start; }
.hourly .rowlabel{ font-size:11px; }
.colhead{ flex-direction:column; align-items:flex-start; justify-content:center; gap:0; font-family:"Archivo", sans-serif; padding-top:8px; padding-bottom:8px; position:relative; }
.colhead .day{ font-weight:800; font-size:13.5px; }
.colhead .date{ font-family:"IBM Plex Mono", monospace; font-weight:500; font-size:10.5px; color:var(--ink-faint); }
.hourly .colhead{ align-items:center; padding-top:20px; }
.hourly .colhead .day{ font-size:10.5px; }
.daytag{ position:absolute; top:2px; left:2px; right:2px; font-size:8px; font-weight:700; color:var(--accent); white-space:nowrap; text-align:center; letter-spacing:0.01em; }
.day-start{ border-left:2px solid var(--accent) !important; }

.consensus-row{ grid-column:1/9; display:grid; grid-template-columns:150px repeat(7,1fr); min-height:74px; border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line); }
.consensus-row.hourly{ grid-column:1/-1; grid-template-columns:150px repeat(var(--ncols),40px); min-height:58px; }
.consensus-row .rowlabel{ background:var(--consensus-bg); font-weight:700; color:var(--ink); border-bottom:none; }
.consensus-svg{ position:relative; }
.consensus-svg svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.consensus-cell{ position:relative; z-index:1; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:4px 2px; border-bottom:none; }
.consensus-cell .cval{ font-size:13px; font-weight:700; padding:1px 5px; border-radius:5px; }
.hourly .consensus-cell .cval{ font-size:10px; padding:1px 3px; }
.consensus-cell .crange{ font-size:9.5px; font-weight:500; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; background:var(--panel); padding:0 3px; border-radius:3px; }

.dir{ font-family:"IBM Plex Sans", sans-serif; font-size:9.5px; font-weight:700; opacity:0.75; margin-left:3px; letter-spacing:0.02em; }
.gust-pill{ display:inline-block; font-family:"IBM Plex Mono", monospace; font-size:9px; font-weight:700; padding:1px 5px; border-radius:5px; margin-left:0; margin-top:1px; white-space:nowrap; }

.group-label{ font-family:"IBM Plex Mono", monospace; font-size:9.5px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-faint); background:var(--panel-alt); padding:4px 10px; }
.model-row .rowlabel{ font-family:"IBM Plex Mono", monospace; font-size:10px; font-weight:600; letter-spacing:0.02em; color:var(--ink-faint); padding-left:22px; }
.model-row .cell:not(.rowlabel){ font-weight:600; }
.model-row:last-child .cell{ border-bottom:none; }
.model-row .cell.na{ color:var(--ink-faint); opacity:.45; font-weight:500; }

.sev-0{ background:var(--sev0-bg); color:var(--sev0-fg); }
.sev-1{ background:var(--sev1-bg); color:var(--sev1-fg); }
.sev-2{ background:var(--sev2-bg); color:var(--sev2-fg); }
.sev-3{ background:var(--sev3-bg); color:var(--sev3-fg); }
.sev-4{ background:var(--sev4-bg); color:var(--sev4-fg); }

.notes{ background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:20px 22px; }
.notes h2{ font-family:"Archivo", sans-serif; font-size:15.5px; font-weight:800; margin:0 0 10px; }
.notes ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-soft); line-height:1.5; }
.notes strong{ color:var(--ink); font-weight:600; }
.notes a{ color:var(--accent); }

@media (max-width:640px){ .page{ padding:28px 14px 48px; } }

</style>

    <div id="notesHtml"></div>
  </div>
</div>

  if(v===null || v===undefined || Number.isNaN(v)) return "—";
  return decimals>0 ? v.toFixed(decimals) : Math.round(v).toString();
}
function mean(arr){ const a = arr.filter(v=>v!==null && v!==undefined && !Number.isNaN(v)); return a.length ? a.reduce((s,v)=>s+v,0)/a.length : null; }

const D = window.TABLE_DATA;
const nCols = D.timeCols.length;
document.documentElement.style.setProperty('--ncols', nCols);

function dsc(i){
  if(D.mode!=="hourly") return "";
  return (D.timeCols[i].hod===0 && i>0) ? " day-start" : "";
}

// --- masthead / meta ---
document.getElementById("mh-eyebrow").textContent = D.meta.eyebrow;
document.getElementById("mh-title").innerHTML = D.meta.titleHtml;
document.getElementById("mh-sub").innerHTML = D.meta.subHtml;
document.getElementById("mh-version").textContent = D.meta.version;
document.getElementById("mh-meta-strip").innerHTML = D.meta.metaStripHtml;

// --- almanac ---
const almanacHead = D.dayLabels.map(d=>`<div class="cell colhead"><span class="day">${d}</span></div>`).join("");
document.getElementById("almanacGrid").style.gridTemplateColumns = `150px repeat(${D.dayLabels.length},1fr)`;
document.getElementById("almanacGrid").innerHTML = `
  <div class="cell rowlabel" style="font-weight:700;">Giorno</div>
  ${almanacHead}
  <div class="cell rowlabel">Alba</div>
  ${D.almanac.alba.map(t=>`<div class="cell time-cell">${t||"—"}</div>`).join("")}
  <div class="cell rowlabel">Tramonto</div>
  ${D.almanac.tramonto.map(t=>`<div class="cell time-cell">${t||"—"}</div>`).join("")}
  <div class="cell rowlabel" style="border-bottom:none;">Fase lunare</div>
  ${D.almanac.luna.map(l=>`<div class="cell moon-cell" style="border-bottom:none;">
      <span class="moonpct">${l.pct}%</span>
      <span class="spread-track"><span class="spread-fill" style="width:${l.pct}%"></span></span>
      <span class="moonlabel">${l.label}</span>
    </div>`).join("")}
`;

// --- models key (toolbar) ---
const allModels = D.modelsMeta.concat(D.waveModelsMeta||[]);
document.getElementById("modelsKey").innerHTML = allModels.map(m=>`<span class="mk" title="${m.full}"><b>${m.code}</b></span>`).join("");

const sections = document.getElementById("sections");

function buildTrendSVG(p){
  const codes = p.modelCodes;
  const allVals = [];
  for(const c of codes){ for(const v of p.values[c]){ if(v!==null && v!==undefined) allVals.push(v); } }
  if(!allVals.length) return "";
  let lo = Math.min(...allVals), hi = Math.max(...allVals);
  const pad = (hi-lo)*0.18 || 1;
  lo -= pad; hi += pad;
  const n = nCols;
  const x = i => (n>1) ? (i/(n-1))*700 : 350;
  const y = v => 90 - ((v-lo)/(hi-lo))*76;

  const modelLines = codes.map(c=>{
    const pts = [];
    p.values[c].forEach((v,i)=>{ if(v!==null && v!==undefined) pts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });
    if(pts.length<2) return "";
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink-faint)" stroke-width="1" opacity="0.28" stroke-linejoin="round" stroke-linecap="round" />`;
  }).join("");

  const meanPts = [];
  for(let i=0;i<n;i++){
    const v = mean(codes.map(c=>p.values[c][i]));
    if(v!==null) meanPts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  }
  const meanLine = meanPts.join(" ");
  const areaPts = meanPts.length ? `${meanPts[0].split(",")[0]},96 ${meanLine} ${meanPts[meanPts.length-1].split(",")[0]},96` : "";

  return `<svg viewBox="0 0 700 100" preserveAspectRatio="none">
      ${areaPts ? `<polygon points="${areaPts}" fill="var(--accent)" opacity="0.08" />` : ""}
      ${modelLines}
      <polyline points="${meanLine}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    </svg>`;
}

D.params.forEach(p=>{
  const codes = p.modelCodes;
  const trendSvg = buildTrendSVG(p);

  const dayColsCells = D.timeCols.map((tc,i)=>{
    const vals = codes.map(c=>p.values[c][i]);
    const present = vals.filter(v=>v!==null && v!==undefined);
    const avg = present.length ? present.reduce((a,b)=>a+b,0)/present.length : null;
    const sev = classify(p.classifyAs||p.key, avg);
    const dir = (p.hasDirection && p.dirValues && p.dirValues[i]!=null) ? `<span class="dir">${p.dirValues[i]}</span>` : "";
    let gustHtml = "";
    if(p.hasGust && p.gustValues){
      const gv = codes.map(c=>p.gustValues[c] ? p.gustValues[c][i] : null);
      const gp = gv.filter(v=>v!==null && v!==undefined);
      const gavg = gp.length ? gp.reduce((a,b)=>a+b,0)/gp.length : null;
      const gsev = classify(p.classifyAs||p.key, gavg);
      gustHtml = gavg!==null ? `<span class="gust-pill sev-${gsev}" title="Raffica">R${fmt(gavg,p.decimals)}</span>` : "";
    }
    return `<div class="cell consensus-cell${dsc(i)}" style="grid-column:${2+i};grid-row:1;">
        <span class="cval ${sev!==null?'sev-'+sev:''}">${fmt(avg,p.decimals)}${dir}</span>
        ${gustHtml}
      </div>`;
  }).join("");

  let prevGroup = null;
  const modelRows = codes.map(code=>{
    const meta = allModels.find(m=>m.code===code) || {code, group:null};
    const cells = D.timeCols.map((tc,i)=>{
      const v = p.values[code][i];
      if(v===null || v===undefined) return `<div class="cell na${dsc(i)}">—</div>`;
      const sev = classify(p.classifyAs||p.key, v);
      return `<div class="cell sev-${sev}${dsc(i)}">${fmt(v,p.decimals)}</div>`;
    }).join("");
    const divider = (meta.group && meta.group !== prevGroup && codes.length>4)
      ? `<div style="display:contents"><div class="cell group-label" style="grid-column:1/-1;">Modelli ${meta.group === "globale" ? "globali" : "locali (area limitata)"}</div></div>`
      : "";
    prevGroup = meta.group;
    return `${divider}<div class="model-row" style="display:contents">
        <div class="cell rowlabel">${code}</div>
        ${cells}
      </div>`;
  }).join("");

  const headCells = D.timeCols.map((tc,i)=>{
    if(D.mode==="hourly"){
      return `<div class="cell colhead${dsc(i)}">${tc.hod===0 ? `<span class="daytag">${D.dayLabels[tc.dayIndex]}</span>` : ""}<span class="day">${String(tc.hod).padStart(2,'0')}</span></div>`;
    }
    return `<div class="cell colhead"><span class="day">${tc.d}</span><span class="date">${tc.date}</span></div>`;
  }).join("");

  const excluded = p.excludedModels && p.excludedModels.length
    ? `<span class="warn" title="${p.excludedModels.map(e=>e.code+': '+e.reason).join(' · ')}">${p.excludedModels.length} modell${p.excludedModels.length===1?'o':'i'} escluso${p.excludedModels.length===1?'':'i'}</span>` : "";

  const section = document.createElement("details");
  section.className = "param";
  section.open = !!p.openDefault;
  section.innerHTML = `
    <summary><span class="arrow">&#9656;</span> ${p.label} <span class="unit">${p.unit}</span>${excluded}<span class="desc">${p.threshTxt}</span></summary>
    <div class="table-wrap">
      <div class="pgrid ${D.mode==='hourly'?'hourly':''}">
        <div class="cell rowlabel" style="font-weight:700;">${D.mode==='hourly'?'Ora':'Giorno'}</div>
        ${headCells}
        <div class="consensus-row ${D.mode==='hourly'?'hourly':''}">
          <div class="cell rowlabel" style="grid-column:1;grid-row:1;">Media modelli</div>
          <div class="consensus-svg" style="grid-column:2/-1;grid-row:1;">${trendSvg}</div>
          ${dayColsCells}
        </div>
        ${modelRows}
      </div>
    </div>`;
  sections.appendChild(section);
});

document.getElementById("notesHtml").innerHTML = D.notesHtml;

</script>
